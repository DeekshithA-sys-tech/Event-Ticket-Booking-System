version: '3.8'

services:
  # ── MongoDB Database ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: eventpulse-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - eventpulse-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Distributed Lock Store ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eventpulse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - eventpulse-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API Backend Server ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventpulse-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongo:27017/event_ticket_booking
      - REDIS_URL=redis://redis:6379
      - BULLMQ_REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=super_secret_access_jwt_key_32chars_long_12345
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_32chars_long_67890
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - EMAIL_FROM=EventPulse Tickets <no-reply@eventpulse.com>
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventpulse-net

  # ── Python AI Microservice (FastAPI + Agent Tools) ───────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: eventpulse-ai-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - EXPRESS_API_URL=http://server:5000/api/v1
      - AI_PROVIDER=mock
    depends_on:
      - server
    networks:
      - eventpulse-net

  # ── React Frontend Client (Nginx SPA) ────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eventpulse-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
    networks:
      - eventpulse-net

networks:
  eventpulse-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
